name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui-recorder-electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui-recorder-electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Chromium for packaged app
        run: node scripts/prepare-browser.js

      - name: Build installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:ci

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-rest-api-recorder-${{ github.ref_name }}-windows
          path: |
            ui-recorder-electron/dist/*.exe
            ui-recorder-electron/dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ui-recorder-electron/dist/*.exe
            ui-recorder-electron/dist/*.yml
